name: Build Android Development APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-development-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-development-apk:
    name: Build development client APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      GOOGLE_SERVICES_JSON: ${{ github.workspace }}/.github-secrets/google-services.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate required secrets
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo "Missing EXPO_PUBLIC_SUPABASE_URL secret"; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" || { echo "Missing EXPO_PUBLIC_SUPABASE_ANON_KEY secret"; exit 1; }
          test -n "$GOOGLE_SERVICES_JSON_BASE64" || { echo "Missing GOOGLE_SERVICES_JSON_BASE64 secret"; exit 1; }

      - name: Restore Firebase Android configuration
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          mkdir -p "$(dirname "$GOOGLE_SERVICES_JSON")"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$GOOGLE_SERVICES_JSON"
          node -e "const f=require(process.env.GOOGLE_SERVICES_JSON); if(f.client?.[0]?.client_info?.android_client_info?.package_name !== 'com.wishu.couplewish') throw new Error('google-services.json package_name must be com.wishu.couplewish')"

      - name: Install JavaScript dependencies
        run: npm ci --include=dev

      - name: Validate TypeScript and lint
        run: |
          npm run typecheck
          npm run lint

      - name: Generate Android development project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Configure fixed development signing
        shell: bash
        env:
          WISH_TWO_DEV_KEYSTORE_BASE64: ${{ secrets.WISH_TWO_DEV_KEYSTORE_BASE64 }}
          WISH_TWO_DEV_KEYSTORE_PASSWORD: ${{ secrets.WISH_TWO_DEV_KEYSTORE_PASSWORD }}
          WISH_TWO_DEV_KEY_ALIAS: ${{ secrets.WISH_TWO_DEV_KEY_ALIAS }}
          WISH_TWO_DEV_KEY_PASSWORD: ${{ secrets.WISH_TWO_DEV_KEY_PASSWORD }}
        run: |
          set +x
          umask 077
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          for (const name of ['WISH_TWO_DEV_KEYSTORE_BASE64', 'WISH_TWO_DEV_KEYSTORE_PASSWORD', 'WISH_TWO_DEV_KEY_ALIAS', 'WISH_TWO_DEV_KEY_PASSWORD']) {
            if (!process.env[name]) throw new Error(`Missing ${name} secret`);
          }
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'wish-two-development.keystore'), Buffer.from(process.env.WISH_TWO_DEV_KEYSTORE_BASE64, 'base64'), { mode: 0o600 });
          fs.appendFileSync('android/app/build.gradle', `
          android {
              signingConfigs {
                  debug {
                      storeFile file(System.getenv('WISH_TWO_DEV_KEYSTORE_PATH'))
                      storePassword System.getenv('WISH_TWO_DEV_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('WISH_TWO_DEV_KEY_ALIAS')
                      keyPassword System.getenv('WISH_TWO_DEV_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          `);
          NODE

      - name: Build development APK
        working-directory: android
        env:
          WISH_TWO_DEV_KEYSTORE_PATH: ${{ runner.temp }}/wish-two-development.keystore
          WISH_TWO_DEV_KEYSTORE_PASSWORD: ${{ secrets.WISH_TWO_DEV_KEYSTORE_PASSWORD }}
          WISH_TWO_DEV_KEY_ALIAS: ${{ secrets.WISH_TWO_DEV_KEY_ALIAS }}
          WISH_TWO_DEV_KEY_PASSWORD: ${{ secrets.WISH_TWO_DEV_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK signing certificate
        shell: bash
        run: |
          apksigner_path=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$apksigner_path" || { echo 'apksigner not found'; exit 1; }
          expected='0d2b3e123aa2ac43ed8cc23d66a886224c6c15a637aac8ba1a4964036709614c'
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/debug/*.apk)
          test "${#apks[@]}" -gt 0 || { echo 'Development APK not found'; exit 1; }
          for apk in "${apks[@]}"; do
            report=$("$apksigner_path" verify --print-certs "$apk")
            actual=$(printf '%s\n' "$report" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':\r ' | tr '[:upper:]' '[:lower:]')
            test "$actual" = "$expected" || { echo 'APK signing certificate SHA-256 mismatch'; exit 1; }
          done
          echo 'APK signing certificate SHA-256 verified.'

      - name: Collect development APK
        shell: bash
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/*.apk artifacts/wish-u-development-${GITHUB_SHA::7}.apk

      - name: Upload development APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wish-u-development-apk-${{ github.run_number }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove development keystore
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/wish-two-development.keystore"
